# sentin8-sys - one repo, one cargo workspace: the service binary + its
# SDK mini-facade (SDD 3.1). The facade re-exports the client/contracts
# crates; consumers pin this repo git tag {svc}-sdk-vX.Y.Z.

[workspace]
resolver = "2"
members = [".", "sdk/crates/sys-contracts", "sdk/facade"]

# SPDX-FileCopyrightText: Copyright Logically Magic Inc. <hello@logicallymagic.com>
# SPDX-FileCopyrightText: Copyright Hamid Jahanzad <Hamid@Jahanzad.com>
# SPDX-FileCopyrightText: Copyright Contributors to the Sentin8:Sys
# SPDX-License-Identifier: Apache-2.0

[package]
name = "sentin8-sys"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sentin8/sentin8-sys"
rust-version = "1.85"
description = "Sentin8 Sentin8:Sys - control plane, org/env lifecycle, saga orchestration."

[[bin]]
name = "sentin8-sys"
path = "src/main.rs"

[lib]
name = "sentin8_sys_server"
path = "src/lib.rs"

[dependencies]
# THE SDK pin (RS 2.3) - the only cross-repo dependency. It carries the
# entire shared library workspace (core/identity/tls/bus/shield/shell +
# every sys-client/contracts SDK crate) behind the `sentin8` facade.
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.19" }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider"], default-features = false }
utoipa = { version = "5", features = ["chrono", "uuid"] }
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
tower = { version = "0.5", features = ["util", "util"] }
rand = "0.8"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
repository = "https://github.com/Sentin8/sentin8-sys"

[workspace.dependencies]
# Versions mirror the SDK workspace (sentin8-sdk/Cargo.toml) - kept in
# sync by the owner repo's bumps.
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots-no-provider"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
async-trait = "0.1"

# Shared-plane leaf crates resolve through the SDK git pin - a git-pinned
# workspace exports every member crate under the same source (SDD §3.1;
# the facade re-export alone is not enough for moved crates that link
# leaf crates directly).
sdk_git = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.19" }
sentin8 = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.19" }
sentin8-middleware = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.19" }
sentin8-m2m = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.19" }
sentin8-tls = { git = "https://github.com/Sentin8/sentin8-sdk", tag = "sdk-v0.6.19" }
sentin8-sys-contracts = { path = "sdk/crates/sys-contracts" }
sentin8-sys-sdk = { path = "sdk/facade" }
